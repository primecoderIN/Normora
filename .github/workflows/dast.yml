name: "OWASP ZAP DAST"

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 0' # Run weekly on Sunday at 3:00 AM

jobs:
  zap_scan:
    name: Run DAST Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Start Docker Compose Stack
      run: |
        # Generate the .env file with default credentials just like start.ps1 does locally
        echo "POSTGRES_USER=postgres" > .env
        echo "POSTGRES_PASSWORD=password" >> .env
        echo "POSTGRES_DB=normoradb" >> .env
        echo "KEYCLOAK_ADMIN=admin" >> .env
        echo "KEYCLOAK_ADMIN_PASSWORD=admin" >> .env
        echo "MINIO_ROOT_USER=admin" >> .env
        echo "MINIO_ROOT_PASSWORD=password" >> .env
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=password" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        
        # Generate missing Angular environments that are ignored in Git
        cp client/src/environments/environment.template.ts client/src/environments/environment.ts
        cp client/src/environments/environment.template.ts client/src/environments/environment.prod.ts
        
        # Start the stack
        docker compose up -d

    - name: Wait for services to be healthy
      run: |
        echo "Waiting for services to initialize..."
        sleep 30 # Give Keycloak, Postgres, and the .NET API time to fully boot up

    - name: ZAP Baseline Scan (Frontend)
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:4200'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        artifact_name: 'zap_scan_frontend'
        fail_action: false # Prevent the build from failing on low/medium alerts initially
        create_issue: false # Do not attempt to create GitHub issues (fixes permission errors)
      continue-on-error: true

    - name: ZAP API Scan (Backend - Unauthenticated)
      uses: zaproxy/action-api-scan@v0.8.0
      with:
        target: 'http://localhost:5000/openapi/v1.json'
        format: openapi
        rules_file_name: '.zap/rules.tsv'
        fail_action: false
        artifact_name: 'zap_scan_backend'
        create_issue: false
      continue-on-error: true

    - name: Tear down stack
      if: always()
      run: docker compose down -v
