<div class="grid gap-8">
  <p-toast></p-toast>

  <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <p class="text-[0.72rem] font-extrabold uppercase text-indigo-600 m-0 mb-1">Knowledge base</p>
      <h1 class="text-[1.75rem] leading-[1.15] text-surface-900 m-0 font-bold">Documents</h1>
      <p class="text-[0.9rem] text-surface-500 m-0 mt-1.5">Upload, monitor, and curate the files employees can search.</p>
    </div>

    <div class="flex items-stretch sm:items-center gap-3 flex-wrap">
      <label class="flex items-center gap-2 h-10 px-3 bg-white border border-surface-200 rounded-lg w-full sm:w-[min(22rem,38vw)] focus-within:border-indigo-500 transition-colors">
        <i class="pi pi-search text-surface-500"></i>
        <input
          type="text"
          pInputText
          placeholder="Search documents"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
          class="flex-1 min-w-0 bg-transparent border-none shadow-none outline-none p-0 text-surface-900 placeholder:text-surface-400"
        />
      </label>
      <p-button icon="pi pi-bell" styleClass="!w-10 !h-10 !p-0 flex items-center justify-center !bg-white !border-surface-200 !text-surface-500 hover:!bg-surface-50 transition-colors" ariaLabel="Notifications"></p-button>
      <p-button label="Upload" icon="pi pi-cloud-upload" styleClass="!bg-indigo-600 !border-indigo-600 !text-white hover:!bg-indigo-700 font-bold !px-3.5 !py-2 !h-10 whitespace-nowrap transition-colors" (onClick)="showUploadDialog.set(true)"></p-button>
    </div>
  </header>

  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" aria-label="Document status">
    <app-stat-card
      title="Total"
      [value]="documents().length"
      icon="pi-file"
      colorClass="bg-indigo-50 text-indigo-600"
      trend="neutral"
      trendText="All uploaded files">
    </app-stat-card>

    <app-stat-card
      title="Ready"
      [value]="readyCount()"
      icon="pi-check-circle"
      colorClass="bg-emerald-50 text-emerald-600"
      trend="up"
      trendText="Searchable now">
    </app-stat-card>

    <app-stat-card
      title="Processing"
      [value]="processingCount()"
      icon="pi-spin pi-spinner"
      colorClass="bg-blue-50 text-blue-600"
      trend="neutral"
      trendText="Being indexed">
    </app-stat-card>

    <app-stat-card
      title="Failed"
      [value]="failedCount()"
      icon="pi-exclamation-circle"
      colorClass="bg-red-50 text-red-600"
      trend="down"
      trendText="Needs attention">
    </app-stat-card>
  </section>

  <section class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white border border-surface-200 rounded-lg p-1.5 overflow-x-auto custom-scrollbar" aria-label="Document filters">
    <div class="flex items-center gap-1 min-w-max">
      <button
        type="button"
        [class]="selectedStatus() === 'All' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'"
        class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all"
        (click)="selectStatus('All')"
      >
        All <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ documents().length }}</span>
      </button>
      <button
        type="button"
        [class]="selectedStatus() === 'Ready' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'"
        class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all"
        (click)="selectStatus('Ready')"
      >
        Ready <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ readyCount() }}</span>
      </button>
      <button
        type="button"
        [class]="selectedStatus() === 'Processing' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'"
        class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all"
        (click)="selectStatus('Processing')"
      >
        Processing <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ processingCount() }}</span>
      </button>
      <button
        type="button"
        [class]="selectedStatus() === 'Failed' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'"
        class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all"
        (click)="selectStatus('Failed')"
      >
        Failed <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ failedCount() }}</span>
      </button>
    </div>

    <p-button label="Filters" icon="pi pi-filter" styleClass="!bg-white !border-surface-200 !text-surface-700 hover:!bg-surface-50 font-bold !px-3.5 !py-1.5 !h-9 !text-[0.875rem] transition-colors"></p-button>
  </section>

  <section class="min-h-100">
    @if (filteredDocuments().length > 0) {
      <app-document-list
        [documents]="filteredDocuments()"
        [departments]="departments()"
        (onDelete)="deleteDocument($event)">
      </app-document-list>
    } @else {
      <app-empty-state
        icon="pi-folder-open"
        title="No matching documents"
        description="Upload a file or adjust the current filters."
        actionLabel="Upload document"
        actionIcon="pi-cloud-upload"
        iconBgClass="bg-indigo-50"
        iconColorClass="text-indigo-600"
        (action)="showUploadDialog.set(true)">
      </app-empty-state>
    }
  </section>

  <section class="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-4">
    <button type="button" class="flex flex-col items-center justify-center gap-2 min-h-38 bg-indigo-50/50 border border-dashed border-indigo-200 rounded-lg text-indigo-700 cursor-pointer hover:bg-indigo-50 hover:border-indigo-300 transition-colors" (click)="showUploadDialog.set(true)">
      <span class="flex items-center justify-center w-10 h-10 bg-indigo-100 rounded-full text-indigo-600"><i class="pi pi-cloud-upload"></i></span>
      <strong class="font-bold">Upload source material</strong>
      <small class="text-indigo-500/80">PDF, DOCX, and TXT files up to 20MB</small>
    </button>

    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-amber-50/30 border border-amber-200/60 rounded-lg p-5 lg:flex-col lg:items-start lg:justify-center">
      <div>
        <strong class="block text-surface-900 font-bold">Content quality</strong>
        <small class="block text-surface-500 mt-1">Keep policies current so answers stay reliable.</small>
      </div>
      <p-button label="Categories" icon="pi pi-folder-open" styleClass="!bg-white !border-surface-200 !text-surface-700 hover:!bg-surface-50 font-bold !px-3.5 !py-2 !h-9 !text-[0.875rem] whitespace-nowrap transition-colors"></p-button>
    </div>
  </section>

  <p-dialog
    header="Upload document"
    [visible]="showUploadDialog()"
    (visibleChange)="showUploadDialog.set($event)"
    [modal]="true"
    [style]="{ width: '450px' }">
    
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-surface-700">Departments (Optional)</label>
        <p-multiselect
          [options]="departments()"
          [ngModel]="selectedUploadDeptIds()"
          (ngModelChange)="selectedUploadDeptIds.set($event)"
          optionLabel="name"
          optionValue="id"
          placeholder="Company wide (Select departments to restrict access)"
          [filter]="true"
          display="chip"
          styleClass="w-full">
        </p-multiselect>
        <small class="text-xs text-surface-500">If no departments are selected, all employees can search this document.</small>
      </div>

      <p-fileupload
        name="file"
        [url]="uploadUrl"
        (onBeforeSend)="onBeforeSend($event)"
        (onUpload)="onUpload($event)"
        (onError)="onError($event)"
        [multiple]="false"
        accept=".pdf,.docx,.txt"
        [maxFileSize]="20971520"
        chooseLabel="Select file"
        uploadLabel="Upload"
        cancelLabel="Cancel"
        styleClass="p-fileupload-custom w-full">
      </p-fileupload>
    </div>
  </p-dialog>
</div>
