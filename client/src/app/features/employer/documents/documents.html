<div class="documents-page">
  <p-toast></p-toast>

  <header class="page-header">
    <div>
      <p class="eyebrow">Knowledge base</p>
      <h1>Documents</h1>
      <p>Upload, monitor, and curate the files employees can search.</p>
    </div>

    <div class="header-actions">
      <label class="search-field">
        <i class="pi pi-search"></i>
        <input
          type="text"
          pInputText
          placeholder="Search documents"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
        />
      </label>
      <button type="button" class="icon-button" aria-label="Notifications">
        <i class="pi pi-bell"></i>
      </button>
      <button type="button" class="primary-button" (click)="showUploadDialog.set(true)">
        <i class="pi pi-cloud-upload"></i>
        Upload
      </button>
    </div>
  </header>

  <section class="metric-grid" aria-label="Document status">
    <app-stat-card
      title="Total"
      [value]="documents().length"
      icon="pi-file"
      colorClass="bg-indigo-50 text-indigo-600"
      trend="neutral"
      trendText="All uploaded files">
    </app-stat-card>

    <app-stat-card
      title="Ready"
      [value]="readyCount()"
      icon="pi-check-circle"
      colorClass="bg-emerald-50 text-emerald-600"
      trend="up"
      trendText="Searchable now">
    </app-stat-card>

    <app-stat-card
      title="Processing"
      [value]="processingCount()"
      icon="pi-spin pi-spinner"
      colorClass="bg-blue-50 text-blue-600"
      trend="neutral"
      trendText="Being indexed">
    </app-stat-card>

    <app-stat-card
      title="Failed"
      [value]="failedCount()"
      icon="pi-exclamation-circle"
      colorClass="bg-red-50 text-red-600"
      trend="down"
      trendText="Needs attention">
    </app-stat-card>
  </section>

  <section class="toolbar" aria-label="Document filters">
    <div class="tabs">
      <button
        type="button"
        [class.active]="selectedStatus() === 'All'"
        (click)="selectStatus('All')"
      >
        All <span>{{ documents().length }}</span>
      </button>
      <button
        type="button"
        [class.active]="selectedStatus() === 'Ready'"
        (click)="selectStatus('Ready')"
      >
        Ready <span>{{ readyCount() }}</span>
      </button>
      <button
        type="button"
        [class.active]="selectedStatus() === 'Processing'"
        (click)="selectStatus('Processing')"
      >
        Processing <span>{{ processingCount() }}</span>
      </button>
      <button
        type="button"
        [class.active]="selectedStatus() === 'Failed'"
        (click)="selectStatus('Failed')"
      >
        Failed <span>{{ failedCount() }}</span>
      </button>
    </div>

    <button type="button" class="secondary-button">
      <i class="pi pi-filter"></i>
      Filters
    </button>
  </section>

  <section class="document-section">
    @if (filteredDocuments().length > 0) {
      <app-document-list
        [documents]="filteredDocuments()"
        (onDelete)="deleteDocument($event)">
      </app-document-list>
    } @else {
      <app-empty-state
        icon="pi-folder-open"
        title="No matching documents"
        description="Upload a file or adjust the current filters."
        actionLabel="Upload document"
        actionIcon="pi-cloud-upload"
        iconBgClass="bg-indigo-50"
        iconColorClass="text-indigo-600"
        (action)="showUploadDialog.set(true)">
      </app-empty-state>
    }
  </section>

  <section class="support-grid">
    <button type="button" class="upload-panel" (click)="showUploadDialog.set(true)">
      <span><i class="pi pi-cloud-upload"></i></span>
      <strong>Upload source material</strong>
      <small>PDF, DOCX, and TXT files up to 20MB</small>
    </button>

    <div class="review-panel">
      <div>
        <strong>Content quality</strong>
        <small>Keep policies current so answers stay reliable.</small>
      </div>
      <button type="button" class="secondary-button">
        <i class="pi pi-folder-open"></i>
        Categories
      </button>
    </div>
  </section>

  <p-dialog
    header="Upload document"
    [visible]="showUploadDialog()"
    (visibleChange)="showUploadDialog.set($event)"
    [modal]="true"
    [style]="{ width: '420px' }">
    <p-fileupload
      name="file"
      [url]="uploadUrl"
      (onBeforeUpload)="onBeforeUpload($event)"
      (onUpload)="onUpload($event)"
      (onError)="onError($event)"
      [multiple]="false"
      accept=".pdf,.docx,.txt"
      [maxFileSize]="20971520"
      chooseLabel="Select file"
      uploadLabel="Upload"
      cancelLabel="Cancel"
      styleClass="p-fileupload-custom w-full">
    </p-fileupload>
  </p-dialog>
</div>
