<div class="flex flex-col gap-8">
  <p-toast></p-toast>

  <header class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
    <div>
      <p class="text-[0.72rem] font-extrabold uppercase tracking-wider text-indigo-600 m-0 mb-1">Knowledge base</p>
      <h1 class="text-[1.75rem] font-bold text-surface-900 leading-[1.15] m-0">Documents</h1>
      <p class="text-[0.9rem] text-surface-500 m-0 mt-1.5">Upload, monitor, and curate the files employees can search.</p>
    </div>

    <div class="flex items-stretch sm:items-center gap-3 flex-wrap">
      <label class="flex items-center gap-2 h-10 px-3 bg-white border border-surface-200 rounded-lg w-full sm:w-[min(22rem,38vw)] focus-within:border-indigo-500 transition-colors">
        <i class="pi pi-search text-surface-500"></i>
        <input
          type="text"
          pInputText
          placeholder="Search documents"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
          class="flex-1 min-w-0 bg-transparent border-none shadow-none outline-none p-0 text-surface-900 placeholder:text-surface-400"
        />
      </label>
      <p-button icon="pi pi-bell" styleClass="!w-10 !h-10 !p-0 flex items-center justify-center !bg-white !border-surface-200 !text-surface-500 hover:!bg-surface-50 transition-colors rounded-lg" ariaLabel="Notifications"></p-button>
      <button type="button" class="flex items-center justify-center gap-2 h-10 px-4 bg-indigo-600 text-white border border-indigo-600 rounded-lg font-bold text-sm hover:bg-indigo-700 transition-colors whitespace-nowrap" (click)="showUploadDialog.set(true)">
        <i class="pi pi-cloud-upload"></i> Upload
      </button>
    </div>
  </header>

  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" aria-label="Document status">
    <app-stat-card title="Total" [value]="documents().length" icon="pi-file" colorClass="bg-indigo-50 text-indigo-600" trend="neutral" trendText="All uploaded files"></app-stat-card>
    <app-stat-card title="Ready" [value]="readyCount()" icon="pi-check-circle" colorClass="bg-emerald-50 text-emerald-600" trend="up" trendText="Searchable now"></app-stat-card>
    <app-stat-card title="Processing" [value]="processingCount()" icon="pi-spin pi-spinner" colorClass="bg-blue-50 text-blue-600" trend="neutral" trendText="Being indexed"></app-stat-card>
    <app-stat-card title="Failed" [value]="failedCount()" icon="pi-exclamation-circle" colorClass="bg-red-50 text-red-600" trend="down" trendText="Needs attention"></app-stat-card>
  </section>

  <section class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white border border-surface-200 rounded-lg p-1.5 overflow-x-auto custom-scrollbar" aria-label="Document filters">
    <div class="flex items-center gap-1 min-w-max">
      <button type="button" [class]="selectedStatus() === 'All' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'" class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all" (click)="selectStatus('All')">
        All <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ documents().length }}</span>
      </button>
      <button type="button" [class]="selectedStatus() === 'Ready' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'" class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all" (click)="selectStatus('Ready')">
        Ready <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ readyCount() }}</span>
      </button>
      <button type="button" [class]="selectedStatus() === 'Processing' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'" class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all" (click)="selectStatus('Processing')">
        Processing <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ processingCount() }}</span>
      </button>
      <button type="button" [class]="selectedStatus() === 'Failed' ? 'bg-surface-100 text-surface-900 shadow-[0_1px_2px_rgba(15,23,42,0.06)]' : 'bg-transparent text-surface-600 hover:bg-surface-50 hover:text-surface-900'" class="flex items-center gap-2 h-9 px-3.5 rounded-md font-bold text-[0.875rem] transition-all" (click)="selectStatus('Failed')">
        Failed <span class="bg-surface-200 text-surface-700 px-1.5 py-0.5 rounded text-[0.68rem] min-w-5 text-center">{{ failedCount() }}</span>
      </button>
    </div>
  </section>

  <section class="min-h-100">
    @if (isLoading()) {
      <div class="bg-white border border-surface-200 rounded-lg overflow-hidden divide-y divide-surface-100">
        @for (_ of [1,2,3,4,5,6]; track $index) {
          <div class="flex items-center gap-4 px-5 py-4">
            <p-skeleton width="2.5rem" height="2.5rem" borderRadius="8px" />
            <div class="flex flex-col gap-2 flex-1">
              <p-skeleton width="45%" height="1rem" borderRadius="6px" />
              <p-skeleton width="30%" height="0.75rem" borderRadius="6px" />
            </div>
            <p-skeleton width="5rem" height="1.5rem" borderRadius="999px" />
            <p-skeleton width="2rem" height="2rem" borderRadius="6px" />
          </div>
        }
      </div>
    } @else if (filteredDocuments().length > 0) {
      <app-document-list
        [documents]="filteredDocuments()"
        [departments]="departments()"
        (onDelete)="deleteDocument($event)">
      </app-document-list>
    } @else {
      <app-empty-state
        icon="pi-folder-open"
        title="No matching documents"
        description="Upload a file or adjust the current filters."
        actionLabel="Upload document"
        actionIcon="pi-cloud-upload"
        iconBgClass="bg-indigo-50"
        iconColorClass="text-indigo-600"
        (action)="showUploadDialog.set(true)">
      </app-empty-state>
    }
  </section>

  <app-document-upload-modal
    [visible]="showUploadDialog()"
    (visibleChange)="showUploadDialog.set($event)"
    [departments]="departments()"
    [uploadUrl]="uploadUrl"
    [token]="token()"
    (uploadSuccess)="onUploadSuccess($event)"
    (uploadError)="onUploadError($event)">
  </app-document-upload-modal>
</div>
