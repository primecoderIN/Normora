<!-- Documents Page -->
<div class="flex flex-col gap-6 sm:gap-8">
  <p-toast></p-toast>

  <!-- Header -->
  <header class="flex flex-col gap-4">
    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
      <div>
        <p class="text-[0.7rem] font-extrabold uppercase tracking-widest text-primary-600 m-0 mb-1.5">Knowledge base</p>
        <h1 class="text-2xl sm:text-[1.75rem] font-bold text-slate-900 dark:text-white leading-[1.15] m-0">Documents</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 m-0 mt-1.5">Upload, monitor, and curate the files employees can search.</p>
      </div>

      <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap sm:shrink-0">
        <label class="flex items-center gap-2 h-10 px-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg flex-1 sm:w-56 sm:flex-none focus-within:border-primary-500 transition-colors">
          <i class="pi pi-search text-slate-400 flex-none"></i>
          <input
            type="text"
            pInputText
            placeholder="Search documents"
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            class="flex-1 min-w-0 bg-transparent border-none! shadow-none! outline-none! focus:outline-none! focus:border-transparent! focus:ring-0! p-0 text-slate-900 dark:text-white placeholder:text-slate-400"
          />
        </label>
        <button
          type="button"
          class="flex items-center justify-center gap-2 h-10 px-4 bg-primary-600 text-white rounded-lg font-semibold text-sm hover:bg-primary-700 active:scale-95 transition-all whitespace-nowrap shadow-sm shadow-primary-500/20 flex-none"
          (click)="showUploadDialog.set(true)"
        >
          <i class="pi pi-cloud-upload"></i>
          <span class="hidden xs:inline sm:inline">Upload</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Stats -->
  <section class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4" aria-label="Document status">
    <app-stat-card title="Total" [value]="documents().length" icon="pi-file" colorClass="bg-primary-50 text-primary-600" trend="neutral" trendText="All uploaded files"></app-stat-card>
    <app-stat-card title="Ready" [value]="readyCount()" icon="pi-check-circle" colorClass="bg-emerald-50 text-emerald-600" trend="up" trendText="Searchable now"></app-stat-card>
    <app-stat-card title="Processing" [value]="processingCount()" icon="pi-spin pi-spinner" colorClass="bg-blue-50 text-blue-600" trend="neutral" trendText="Being indexed"></app-stat-card>
    <app-stat-card title="Failed" [value]="failedCount()" icon="pi-exclamation-circle" colorClass="bg-red-50 text-red-600" trend="down" trendText="Needs attention"></app-stat-card>
  </section>

  <!-- Filter Tabs -->
  <section
    class="flex items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-1.5 overflow-x-auto custom-scrollbar"
    aria-label="Document filters"
  >
    <div class="flex items-center gap-1 min-w-max">
      <button type="button"
        [class]="selectedStatus() === 'All' ? 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm' : 'bg-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-950 hover:text-slate-900 dark:hover:text-white'"
        class="flex items-center gap-2 h-8 px-3.5 rounded-lg font-semibold text-sm transition-all"
        (click)="selectStatus('All')">
        All <span class="bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-1.5 py-0.5 rounded text-[0.65rem] min-w-5 text-center tabular-nums">{{ documents().length }}</span>
      </button>
      <button type="button"
        [class]="selectedStatus() === 'Ready' ? 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm' : 'bg-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-950 hover:text-slate-900 dark:hover:text-white'"
        class="flex items-center gap-2 h-8 px-3.5 rounded-lg font-semibold text-sm transition-all"
        (click)="selectStatus('Ready')">
        Ready <span class="bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded text-[0.65rem] min-w-5 text-center tabular-nums">{{ readyCount() }}</span>
      </button>
      <button type="button"
        [class]="selectedStatus() === 'Processing' ? 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm' : 'bg-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-950 hover:text-slate-900 dark:hover:text-white'"
        class="flex items-center gap-2 h-8 px-3.5 rounded-lg font-semibold text-sm transition-all"
        (click)="selectStatus('Processing')">
        Processing <span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-[0.65rem] min-w-5 text-center tabular-nums">{{ processingCount() }}</span>
      </button>
      <button type="button"
        [class]="selectedStatus() === 'Failed' ? 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm' : 'bg-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-950 hover:text-slate-900 dark:hover:text-white'"
        class="flex items-center gap-2 h-8 px-3.5 rounded-lg font-semibold text-sm transition-all"
        (click)="selectStatus('Failed')">
        Failed <span class="bg-red-100 text-red-700 px-1.5 py-0.5 rounded text-[0.65rem] min-w-5 text-center tabular-nums">{{ failedCount() }}</span>
      </button>
    </div>
  </section>

  <!-- Document list -->
  <section class="min-h-40">
    @if (isLoading()) {
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden divide-y divide-slate-100 dark:divide-slate-800">
        @for (_ of [1,2,3,4,5,6]; track $index) {
          <div class="flex items-center gap-4 px-5 py-4">
            <p-skeleton width="2.5rem" height="2.5rem" borderRadius="10px" />
            <div class="flex flex-col gap-2 flex-1">
              <p-skeleton width="45%" height="1rem" borderRadius="6px" />
              <p-skeleton width="30%" height="0.75rem" borderRadius="6px" />
            </div>
            <p-skeleton width="5rem" height="1.5rem" borderRadius="999px" />
            <p-skeleton width="2rem" height="2rem" borderRadius="8px" />
          </div>
        }
      </div>
    } @else if (filteredDocuments().length > 0) {
      <app-document-list
        [documents]="filteredDocuments()"
        [departments]="departments()"
        [tenantName]="activeTenantName()"
        (onDelete)="deleteDocument($event)">
      </app-document-list>
    } @else {
      <app-empty-state
        icon="pi-folder-open"
        title="No matching documents"
        description="Upload a file or adjust the current filters."
        actionLabel="Upload document"
        actionIcon="pi-cloud-upload"
        iconBgClass="bg-primary-50"
        iconColorClass="text-primary-600"
        (action)="showUploadDialog.set(true)">
      </app-empty-state>
    }
  </section>

  <app-document-upload-modal
    [visible]="showUploadDialog()"
    (visibleChange)="showUploadDialog.set($event)"
    [departments]="departments()"
    [uploadUrl]="uploadUrl"
    [isPersonal]="isPersonalWorkspace()"
    [tenantName]="activeTenantName()"
    (uploadSuccess)="onUploadSuccess($event)"
    (uploadError)="onUploadError($event)">
  </app-document-upload-modal>
</div>
