<div class="flex flex-col gap-8">
  <div>
    <h1 class="text-3xl font-bold text-surface-900 tracking-tight">Dashboard</h1>
    <p class="text-surface-500 mt-2">Welcome back. Here is an overview of your workspace.</p>
  </div>

  <!-- Metrics Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (metric of metrics; track metric.title) {
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-surface-200 hover:shadow-md hover:-translate-y-1 transition-all duration-300">
        <div class="flex justify-between items-start">
          <div>
            <span class="block text-surface-500 font-medium mb-2">{{ metric.title }}</span>
            <div class="text-surface-900 font-bold text-4xl tracking-tight">{{ metric.value }}</div>
          </div>
          <div class="w-12 h-12 rounded-xl bg-surface-50 flex items-center justify-center border border-surface-100">
            <i class="pi {{ metric.icon }} text-xl {{ metric.color }}"></i>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Recent Activity -->
  <div class="bg-white rounded-2xl shadow-sm border border-surface-200 overflow-hidden">
    <div class="p-6 border-b border-surface-200 bg-surface-50/50">
      <h2 class="text-xl font-semibold text-surface-900">Recent Documents</h2>
    </div>
    
    <p-table [value]="recentDocuments" [tableStyle]="{ 'min-width': '50rem' }" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th class="bg-white text-surface-500 font-medium">Document Name</th>
          <th class="bg-white text-surface-500 font-medium">Status</th>
          <th class="bg-white text-surface-500 font-medium">Date Uploaded</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-doc>
        <tr class="hover:bg-surface-50 transition-colors">
          <td class="font-medium text-surface-900">
            <div class="flex items-center gap-3">
              <i class="pi pi-file-pdf text-red-500 text-lg"></i>
              {{ doc.name }}
            </div>
          </td>
          <td>
            <p-tag [value]="doc.status" [severity]="getSeverity(doc.status)" styleClass="rounded-md font-medium text-xs px-2 py-1"></p-tag>
          </td>
          <td class="text-surface-600 font-medium">{{ doc.date | date:'mediumDate' }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
