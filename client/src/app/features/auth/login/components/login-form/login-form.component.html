<div class="flex flex-col h-full bg-white p-6 md:p-10 lg:p-12 2xl:p-16">
  <!-- Header -->
  <div class="flex items-center justify-between mb-8 xl:mb-12">
    <div class="flex items-center gap-2">
      <div class="flex items-center justify-center w-7 h-7 rounded bg-indigo-600 text-white font-bold text-xs">
        N
      </div>
      <span class="font-bold text-lg text-surface-900 tracking-tight">Normora</span>
    </div>
    <div class="text-[13px] text-surface-500">
      New to Normora? <a href="#" class="text-indigo-600 font-medium hover:text-indigo-700 hover:underline">Contact your admin</a>
    </div>
  </div>

  @if (!isProcessing()) {
    <div class="flex-1 flex flex-col justify-center max-w-sm w-full mx-auto">
      <h1 class="text-3xl font-bold text-surface-900 mb-2 tracking-tight">Welcome back</h1>
      <p class="text-surface-500 mb-8 text-[15px] leading-relaxed">
        Sign in to your organization account to access Normora.
      </p>

      <!-- Social Logins -->
      <div class="flex gap-3 mb-6">
        <button 
          class="flex-1 flex items-center justify-center gap-2 px-3 py-2 border border-surface-200 rounded-lg bg-white hover:bg-surface-50 text-surface-700 font-medium text-[13px] transition-colors shadow-sm"
          (click)="onGoogleLogin.emit()">
          <i class="pi pi-google text-red-500 text-[14px]"></i>
          Continue with Google
        </button>
        <button 
          class="flex-1 flex items-center justify-center gap-2 px-3 py-2 border border-surface-200 rounded-lg bg-white hover:bg-surface-50 text-surface-700 font-medium text-[13px] transition-colors shadow-sm"
          (click)="onGithubLogin.emit()">
          <i class="pi pi-github text-surface-900 text-[14px]"></i>
          Continue with GitHub
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-surface-200"></div>
        <span class="text-surface-400 text-[11px] font-semibold uppercase tracking-wider">OR</span>
        <div class="flex-1 h-px bg-surface-200"></div>
      </div>

      <!-- Form (Triggers Keycloak Redirect) -->
      <div class="flex flex-col gap-4 mb-6">
        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-semibold text-surface-900">Email address</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-envelope text-surface-400 text-sm"></i>
            <input 
              pInputText 
              type="email" 
              [(ngModel)]="email" 
              placeholder="you@company.com" 
              class="w-full rounded-lg! bg-white! border-surface-200! hover:border-indigo-400! focus:border-indigo-500! focus:ring-1! focus:ring-indigo-500! text-[14px] py-2.5!" />
          </span>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-semibold text-surface-900">Password</label>
          <span class="p-input-icon-left p-input-icon-right w-full">
            <i class="pi pi-lock text-surface-400 text-sm"></i>
            <input 
              pInputText 
              type="password" 
              [(ngModel)]="password" 
              placeholder="Enter your password" 
              class="w-full rounded-lg! bg-white! border-surface-200! hover:border-indigo-400! focus:border-indigo-500! focus:ring-1! focus:ring-indigo-500! text-[14px] py-2.5!" />
            <i class="pi pi-eye text-surface-400 cursor-pointer hover:text-surface-600 transition-colors text-sm"></i>
          </span>
        </div>
      </div>

      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-2">
          <p-checkbox [(ngModel)]="keepMeSignedIn" [binary]="true" inputId="keepSignedIn"></p-checkbox>
          <label for="keepSignedIn" class="text-[13px] font-medium text-surface-700 cursor-pointer">Keep me signed in</label>
        </div>
        <a href="#" class="text-[13px] font-medium text-indigo-600 hover:text-indigo-700 hover:underline">Forgot password?</a>
      </div>

      <button 
        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-md shadow-indigo-200 transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-[14px]"
        (click)="submitLogin()">
        Sign in
        <i class="pi pi-arrow-right text-[11px]"></i>
      </button>
    </div>
  } @else {
    <div class="flex-1 flex flex-col items-center justify-center text-center max-w-sm mx-auto">
      <p-progress-spinner styleClass="w-12 h-12 mb-4" strokeWidth="4" animationDuration=".5s"></p-progress-spinner>
      <h2 class="text-xl font-bold text-surface-900 mb-1">Authenticating</h2>
      <p class="text-[14px] text-surface-500">Securely signing you in and redirecting to Normora...</p>
    </div>
  }

  <!-- Footer -->
  <div class="mt-auto pt-6 flex items-center justify-center gap-2 text-surface-400 text-[13px]">
    <i class="pi pi-shield"></i>
    <span>Secure, SSO-ready, and trusted by modern teams.</span>
  </div>
</div>
