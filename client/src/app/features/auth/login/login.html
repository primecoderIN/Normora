<main class="min-h-screen bg-white text-surface-900 grid grid-cols-1 lg:grid-cols-2 overflow-hidden">
  <app-login-form 
    [isProcessing]="isProcessingLogin"
    (onLogin)="login()"
    (onGithubLogin)="loginWithGithub()"
    (onGoogleLogin)="loginWithGoogle()">
  </app-login-form>
  
  <div class="hidden lg:block">
    <app-login-promo></app-login-promo>
  </div>
</main>
