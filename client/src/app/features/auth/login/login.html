<div class="flex h-screen items-center justify-center bg-surface-50">
  <p-card styleClass="w-full max-w-md shadow-xl border border-surface-200">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-surface-900 tracking-tight">Welcome to Normora</h2>
      <p class="text-surface-500 mt-2">Please sign in to access the platform</p>
    </div>

    <!-- Normal Login State -->
    @if (!isProcessingLogin) {
      <div class="flex flex-col gap-4">
        <p-button
          label="Sign In with Keycloak"
          icon="pi pi-key"
          (onClick)="login()"
          styleClass="w-full"
          outlined="true"
        ></p-button>
        <p-button
          label="Sign In with GitHub"
          icon="pi pi-github"
          severity="secondary"
          (onClick)="loginWithGithub()"
          styleClass="w-full"
        ></p-button>
      </div>
    } @else {
      <div class="flex flex-col items-center gap-4 py-4">
        <p-progress-spinner
          styleClass="w-12 h-12"
          strokeWidth="4"
          animationDuration=".5s"
        ></p-progress-spinner>
        <p class="text-surface-600 font-medium text-center">
          Login successful, redirecting to Normora...
        </p>
      </div>
    }

    <!-- Processing Login State -->
  </p-card>
</div>
