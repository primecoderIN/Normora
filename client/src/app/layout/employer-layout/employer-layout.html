<div class="flex h-screen bg-surface-50 text-surface-900">
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-surface-200 hidden md:flex flex-col shadow-sm">
    <div class="h-16 flex items-center px-6 border-b border-surface-200">
      <div class="flex items-center gap-2">
        <i class="pi pi-building text-blue-600 text-xl"></i>
        <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Normora</span>
      </div>
    </div>
    
    <nav class="flex-1 p-4 space-y-2">
      <a routerLink="/employer/dashboard" routerLinkActive="bg-blue-50 text-blue-700 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-surface-600 hover:bg-surface-100 transition-colors cursor-pointer">
        <i class="pi pi-home"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/employer/documents" routerLinkActive="bg-blue-50 text-blue-700 font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-lg text-surface-600 hover:bg-surface-100 transition-colors cursor-pointer">
        <i class="pi pi-file"></i>
        <span>Documents</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Topbar -->
    <header class="h-16 bg-white border-b border-surface-200 flex items-center justify-between px-6 shadow-sm z-10">
      <div class="flex items-center gap-4">
        <h2 class="text-lg font-semibold text-surface-800 hidden md:block">Employer Portal</h2>
      </div>
      
      <div class="flex items-center gap-4">
        <p-avatar icon="pi pi-user" shape="circle" class="bg-blue-100 text-blue-600"></p-avatar>
        <p-button icon="pi pi-sign-out" [text]="true" severity="secondary" (onClick)="logout()" title="Logout"></p-button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-surface-50">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
