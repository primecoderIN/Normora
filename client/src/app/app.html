@if (authInitializing()) {
	<main class="min-h-screen bg-slate-50 flex flex-col items-center justify-center relative overflow-hidden" aria-live="polite" aria-busy="true">
		<!-- Subtle background decorators to match login theme -->
		<div class="absolute -top-40 -right-40 w-200 h-200 bg-primary-500/10 rounded-full blur-[100px] mix-blend-multiply opacity-70 animate-pulse pointer-events-none"></div>
		<div class="absolute -bottom-40 -left-40 w-150 h-150 bg-purple-500/10 rounded-full blur-[80px] mix-blend-multiply opacity-50 animate-pulse pointer-events-none" style="animation-delay: 2s;"></div>
		
		<div class="relative z-10 flex flex-col items-center">
			<!-- Animated Logo -->
			<div class="relative mb-8">
				<div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-3xl shadow-lg shadow-blue-500/30 animate-pulse relative z-10">
					N
				</div>
				<!-- Pulsing rings -->
				<div class="absolute inset-0 bg-blue-400 rounded-xl animate-ping opacity-75"></div>
				<div class="absolute -inset-2 bg-blue-100 rounded-2xl animate-pulse opacity-50 z-0"></div>
			</div>
			
			<div class="flex flex-col items-center gap-1">
				<h1 class="text-xl font-bold text-slate-800 tracking-tight">Normora</h1>
				<p class="text-sm font-medium text-slate-500">{{ authStatus() || 'Securing your workspace...' }}</p>
			</div>

			<!-- Bouncing dots loader -->
			<div class="mt-6 flex gap-1.5">
				<div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce" style="animation-delay: 0ms"></div>
				<div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce" style="animation-delay: 150ms"></div>
				<div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce" style="animation-delay: 300ms"></div>
			</div>
		</div>
	</main>
} @else {
	<router-outlet></router-outlet>
}

<p-toast position="bottom-right"></p-toast>
