# ⚠️  LOCAL DEVELOPMENT ONLY — do NOT use this file on a publicly reachable host.
# Infrastructure service ports are bound to 127.0.0.1 to prevent exposure on
# network interfaces. Credentials are loaded from .env (generated by start.ps1).
# Use a separate production deployment that requires explicitly supplied secrets
# and ASPNETCORE_ENVIRONMENT=Production.
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: normora_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-normoradb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "shared_preload_libraries=vector"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: normora_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@normora.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: normora_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloakdb
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_URL: 'http://localhost:8080'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'true'
    command: start-dev --import-realm
    volumes:
      - ${KEYCLOAK_REALM_EXPORT:-./infrastructure/keycloak/realm-export.json}:/opt/keycloak/data/import/realm-export.json
      - ./keycloak-theme/normora:/opt/keycloak/themes/normora
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: normora_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"         # MinIO API — accessed by the Angular client via nginx proxy
      - "127.0.0.1:9001:9001" # MinIO admin console — dev-only, loopback only
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: normora_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tika:
    image: apache/tika:3.2.3.0-full
    container_name: normora_tika
    ports:
      - "9998:9998"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: normora_api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=normoradb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-password}
      - ConnectionStrings__Redis=redis:6379
      - Keycloak__Authority=http://keycloak:8080/realms/normora
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/normora/.well-known/openid-configuration
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-admin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-password}
      - Email__ResendApiKey=${RESEND_API_KEY:-}
      - Email__FromEmail=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - Email__DevOverrideRecipient=${DEV_OVERRIDE_EMAIL:-}
      - Tika__Endpoint=http://tika:9998/
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
      - Stripe__ProPriceId=${STRIPE_PRO_PRICE_ID:-}
      - Stripe__EnterprisePriceId=${STRIPE_ENTERPRISE_PRICE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_started
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: normora_client
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  data_protection_keys:
